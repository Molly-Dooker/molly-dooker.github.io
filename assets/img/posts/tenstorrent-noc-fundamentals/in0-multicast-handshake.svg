<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1200"
  height="900"
  viewBox="0 0 1200 900"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">2D matmul in0 multicast and semaphore handshake</title>
  <desc id="desc">
    One sender reads an in0 block and multicasts it to receiver cores. Receivers first reserve circular-buffer space and
    increment the sender semaphore. The sender then multicasts data followed by a valid flag, and every core publishes
    its circular-buffer entries to compute.
  </desc>

  <defs>
    <marker id="arrow-data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6d28d9" />
    </marker>
    <marker id="arrow-sync" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c2410c" />
    </marker>
    <style>
      .title { font: 700 38px system-ui, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 22px system-ui, sans-serif; fill: #475569; }
      .section { font: 700 28px system-ui, sans-serif; fill: #0f172a; }
      .node-title { font: 700 24px system-ui, sans-serif; fill: #0f172a; }
      .label { font: 500 21px system-ui, sans-serif; fill: #1e293b; }
      .small { font: 500 18px system-ui, sans-serif; fill: #475569; }
      .step { font: 600 20px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #172033; }
      .arrow-label { font: 700 17px system-ui, sans-serif; }
    </style>
  </defs>

  <rect x="1" y="1" width="1198" height="898" rx="22" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" />

  <text x="42" y="52" class="title">2D matmul: one in0 block, multiple consumers</text>
  <text x="42" y="86" class="subtitle">The sender is also a compute core; only receiver cores are multicast destinations.</text>

  <rect x="40" y="145" width="150" height="116" rx="14" fill="#f1f5f9" stroke="#64748b" stroke-width="3" />
  <text x="115" y="190" text-anchor="middle" class="node-title">in0 tensor</text>
  <text x="115" y="225" text-anchor="middle" class="small">source tiles</text>

  <rect x="240" y="145" width="270" height="136" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="4" />
  <text x="375" y="184" text-anchor="middle" class="node-title">Sender core</text>
  <rect x="282" y="192" width="186" height="54" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2" />
  <text x="375" y="226" text-anchor="middle" class="step">local cb_in0</text>
  <text x="375" y="270" text-anchor="middle" class="small">left column; also computes</text>

  <rect x="690" y="145" width="220" height="136" rx="16" fill="#ccfbf1" stroke="#0f766e" stroke-width="4" />
  <text x="800" y="184" text-anchor="middle" class="node-title">Receiver core</text>
  <rect x="720" y="192" width="160" height="54" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2" />
  <text x="800" y="226" text-anchor="middle" class="step">local cb_in0</text>
  <text x="800" y="270" text-anchor="middle" class="small">column 1</text>

  <rect x="950" y="145" width="220" height="136" rx="16" fill="#ccfbf1" stroke="#0f766e" stroke-width="4" />
  <text x="1060" y="184" text-anchor="middle" class="node-title">Receiver core</text>
  <rect x="980" y="192" width="160" height="54" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2" />
  <text x="1060" y="226" text-anchor="middle" class="step">local cb_in0</text>
  <text x="1060" y="270" text-anchor="middle" class="small">column 2</text>

  <line x1="190" y1="203" x2="238" y2="203" stroke="#6d28d9" stroke-width="5" marker-end="url(#arrow-data)" />
  <path d="M 510 203 H 610 V 116 H 800 V 143" fill="none" stroke="#6d28d9" stroke-width="5" marker-end="url(#arrow-data)" />
  <path d="M 800 116 H 1060 V 143" fill="none" stroke="#6d28d9" stroke-width="5" marker-end="url(#arrow-data)" />
  <text x="610" y="108" text-anchor="middle" class="arrow-label" fill="#5b21b6">NoC multicast</text>

  <line x1="40" y1="330" x2="1160" y2="330" stroke="#cbd5e1" stroke-width="2" />
  <text x="42" y="382" class="section">Per-block synchronization</text>
  <text x="1125" y="382" text-anchor="end" class="small">purple = data   orange = state</text>

  <rect x="40" y="410" width="500" height="410" rx="18" fill="#f0fdfa" stroke="#0f766e" stroke-width="3" />
  <rect x="40" y="410" width="500" height="58" rx="18" fill="#99f6e4" />
  <path d="M 40 450 V 428 Q 40 410 58 410 H 522 Q 540 410 540 428 V 468 H 40 z" fill="#99f6e4" />
  <text x="290" y="449" text-anchor="middle" class="node-title">Each receiver core (own L1)</text>

  <rect x="660" y="410" width="500" height="410" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="3" />
  <rect x="660" y="410" width="500" height="58" rx="18" fill="#bfdbfe" />
  <path d="M 660 450 V 428 Q 660 410 678 410 H 1142 Q 1160 410 1160 428 V 468 H 660 z" fill="#bfdbfe" />
  <text x="910" y="449" text-anchor="middle" class="node-title">Sender core (own L1)</text>

  <g fill="#ffffff" stroke="#5eead4" stroke-width="2">
    <rect x="75" y="485" width="430" height="44" rx="9" />
    <rect x="75" y="540" width="430" height="44" rx="9" />
    <rect x="75" y="595" width="430" height="44" rx="9" />
    <rect x="75" y="650" width="430" height="44" rx="9" />
    <rect x="75" y="705" width="430" height="44" rx="9" />
    <rect x="75" y="754" width="430" height="58" rx="9" />
  </g>
  <text x="290" y="514" text-anchor="middle" class="step">reserve_back(cb_in0)</text>
  <text x="290" y="569" text-anchor="middle" class="step">receiver_sem = INVALID</text>
  <text x="290" y="624" text-anchor="middle" class="step">remote atomic: sender_sem += 1</text>
  <text x="290" y="679" text-anchor="middle" class="step">data lands in reserved CB slot</text>
  <text x="290" y="734" text-anchor="middle" class="step">wait(receiver_sem == VALID)</text>
  <text x="290" y="780" text-anchor="middle" class="step">push_back(local cb_in0)</text>
  <text x="290" y="803" text-anchor="middle" class="small">receiver compute can consume it</text>

  <g fill="#ffffff" stroke="#93c5fd" stroke-width="2">
    <rect x="695" y="485" width="430" height="44" rx="9" />
    <rect x="695" y="540" width="430" height="44" rx="9" />
    <rect x="695" y="595" width="430" height="44" rx="9" />
    <rect x="695" y="650" width="430" height="44" rx="9" />
    <rect x="695" y="705" width="430" height="44" rx="9" />
    <rect x="695" y="754" width="430" height="58" rx="9" />
  </g>
  <text x="910" y="514" text-anchor="middle" class="step">reserve_back(cb_in0)</text>
  <text x="910" y="569" text-anchor="middle" class="step">async_read(in0 -&gt; cb_in0)</text>
  <text x="910" y="617" text-anchor="middle" class="small">async_read_barrier(); wait(all ready)</text>
  <text x="910" y="679" text-anchor="middle" class="step">multicast in0 block</text>
  <text x="910" y="734" text-anchor="middle" class="step">multicast receiver_sem = VALID</text>
  <text x="910" y="780" text-anchor="middle" class="step">push_back(local cb_in0)</text>
  <text x="910" y="803" text-anchor="middle" class="small">sender compute can consume it</text>

  <line x1="505" y1="617" x2="695" y2="617" stroke="#c2410c" stroke-width="4" marker-end="url(#arrow-sync)" />
  <text x="600" y="606" text-anchor="middle" class="arrow-label" fill="#9a3412">READY</text>

  <line x1="695" y1="672" x2="505" y2="672" stroke="#6d28d9" stroke-width="5" marker-end="url(#arrow-data)" />
  <text x="600" y="661" text-anchor="middle" class="arrow-label" fill="#5b21b6">BLOCK</text>

  <line x1="695" y1="727" x2="505" y2="727" stroke="#c2410c" stroke-width="4" marker-end="url(#arrow-sync)" />
  <text x="600" y="716" text-anchor="middle" class="arrow-label" fill="#9a3412">VALID</text>

  <text x="600" y="865" text-anchor="middle" class="subtitle">
    Receiver preparation and sender read may overlap; the read barrier waits only for the sender's reads.
  </text>
</svg>
