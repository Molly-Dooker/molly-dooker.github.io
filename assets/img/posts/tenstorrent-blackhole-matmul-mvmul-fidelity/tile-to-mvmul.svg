<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1440"
  height="1180"
  viewBox="0 0 1440 1180"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">SrcB and Dst above SrcA in one 32 by 32 tile matmul</title>
  <desc id="desc">SrcB tile B feeds Dst tile C from the left, while SrcA tile A feeds C from below. Each tile has four faces. Four C faces receive two 16 by 16 face products each, and each face product is split into two 8 by 16 MVMUL instructions.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#334155" />
    </marker>
    <style>
      text { fill: #0f172a; font-family: Inter, Arial, sans-serif; }
      .title { font-size: 34px; font-weight: 700; }
      .subtitle { font-size: 22px; font-weight: 700; }
      .label { font-size: 21px; font-weight: 700; }
      .formula { font-size: 17px; font-weight: 600; }
      .small { font-size: 16px; }
      .count { font-size: 25px; font-weight: 700; }
      .frame { fill: none; stroke: #334155; stroke-width: 4; }
      .srcb { fill: #dbeafe; stroke: #2563eb; stroke-width: 2; }
      .srca { fill: #dcfce7; stroke: #16a34a; stroke-width: 2; }
      .dst { fill: #fef3c7; stroke: #d97706; stroke-width: 2; }
      .primitive { fill: #f3e8ff; stroke: #9333ea; stroke-width: 2; }
      .panel { fill: #f8fafc; stroke: #64748b; stroke-width: 2; }
      .arrow { fill: none; stroke: #334155; stroke-width: 4; marker-end: url(#arrow); }
      .dash { fill: none; stroke: #64748b; stroke-width: 2; stroke-dasharray: 9 8; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1440" height="1180" fill="#ffffff" />
  <text class="title" x="720" y="52" text-anchor="middle">One 32 x 32 tile matmul: SrcB @ SrcA accumulates into Dst</text>

  <!-- B: upper left -->
  <text class="subtitle" x="260" y="112" text-anchor="middle">B: SrcB / logical L (in0)</text>
  <rect class="srcb" x="80" y="140" width="180" height="180" />
  <rect class="srcb" x="260" y="140" width="180" height="180" />
  <rect class="srcb" x="80" y="320" width="180" height="180" />
  <rect class="srcb" x="260" y="320" width="180" height="180" />
  <rect class="frame" x="80" y="140" width="360" height="360" rx="8" />
  <text class="label" x="170" y="215" text-anchor="middle">B0</text>
  <text class="small" x="170" y="248" text-anchor="middle">logical L0</text>
  <text class="label" x="350" y="215" text-anchor="middle">B1</text>
  <text class="small" x="350" y="248" text-anchor="middle">logical L1</text>
  <text class="label" x="170" y="395" text-anchor="middle">B2</text>
  <text class="small" x="170" y="428" text-anchor="middle">logical L2</text>
  <text class="label" x="350" y="395" text-anchor="middle">B3</text>
  <text class="small" x="350" y="428" text-anchor="middle">logical L3</text>

  <!-- C: upper right -->
  <text class="subtitle" x="1040" y="112" text-anchor="middle">C: Dst accumulator</text>
  <rect class="dst" x="860" y="140" width="180" height="180" />
  <rect class="dst" x="1040" y="140" width="180" height="180" />
  <rect class="dst" x="860" y="320" width="180" height="180" />
  <rect class="dst" x="1040" y="320" width="180" height="180" />
  <rect class="frame" x="860" y="140" width="360" height="360" rx="8" />
  <text class="label" x="950" y="182" text-anchor="middle">C0</text>
  <text class="formula" x="950" y="225" text-anchor="middle">B0 @ A0</text>
  <text class="formula" x="950" y="255" text-anchor="middle">+ B1 @ A2</text>
  <text class="label" x="1130" y="182" text-anchor="middle">C1</text>
  <text class="formula" x="1130" y="225" text-anchor="middle">B0 @ A1</text>
  <text class="formula" x="1130" y="255" text-anchor="middle">+ B1 @ A3</text>
  <text class="label" x="950" y="362" text-anchor="middle">C2</text>
  <text class="formula" x="950" y="405" text-anchor="middle">B2 @ A0</text>
  <text class="formula" x="950" y="435" text-anchor="middle">+ B3 @ A2</text>
  <text class="label" x="1130" y="362" text-anchor="middle">C3</text>
  <text class="formula" x="1130" y="405" text-anchor="middle">B2 @ A1</text>
  <text class="formula" x="1130" y="435" text-anchor="middle">+ B3 @ A3</text>

  <!-- B flows horizontally into C -->
  <path class="arrow" d="M 475 320 L 820 320" />
  <text class="label" x="648" y="288" text-anchor="middle">SrcB rows</text>
  <text class="small" x="648" y="348" text-anchor="middle">B0, B1, B2, B3</text>

  <!-- A: below C -->
  <text class="subtitle" x="1040" y="620" text-anchor="middle">A: SrcA / logical R (in1)</text>
  <rect class="srca" x="860" y="650" width="180" height="180" />
  <rect class="srca" x="1040" y="650" width="180" height="180" />
  <rect class="srca" x="860" y="830" width="180" height="180" />
  <rect class="srca" x="1040" y="830" width="180" height="180" />
  <rect class="frame" x="860" y="650" width="360" height="360" rx="8" />
  <text class="label" x="950" y="725" text-anchor="middle">A0</text>
  <text class="small" x="950" y="758" text-anchor="middle">logical R0</text>
  <text class="label" x="1130" y="725" text-anchor="middle">A1</text>
  <text class="small" x="1130" y="758" text-anchor="middle">logical R1</text>
  <text class="label" x="950" y="905" text-anchor="middle">A2</text>
  <text class="small" x="950" y="938" text-anchor="middle">logical R2</text>
  <text class="label" x="1130" y="905" text-anchor="middle">A3</text>
  <text class="small" x="1130" y="938" text-anchor="middle">logical R3</text>

  <!-- A flows vertically into C -->
  <path class="arrow" d="M 1040 595 L 1040 535" />
  <text class="label" x="1080" y="568">SrcA columns</text>

  <!-- One face product expands into two row-half MVMULs -->
  <path class="dash" d="M 855 230 C 770 310, 780 560, 710 680" />
  <rect class="panel" x="80" y="650" width="650" height="360" rx="14" />
  <text class="subtitle" x="405" y="695" text-anchor="middle">One term inside an output face</text>

  <rect class="srcb" x="145" y="730" width="175" height="70" rx="8" />
  <text class="label" x="232" y="760" text-anchor="middle">B0</text>
  <text class="small" x="232" y="785" text-anchor="middle">16 x 16</text>
  <text class="count" x="355" y="775" text-anchor="middle">@</text>
  <rect class="srca" x="390" y="730" width="175" height="70" rx="8" />
  <text class="label" x="478" y="760" text-anchor="middle">A0</text>
  <text class="small" x="478" y="785" text-anchor="middle">16 x 16</text>

  <path class="arrow" d="M 355 815 L 355 850" />
  <rect class="primitive" x="135" y="865" width="540" height="96" rx="10" />
  <line x1="135" y1="913" x2="675" y2="913" stroke="#9333ea" stroke-width="2" />
  <text class="formula" x="405" y="895" text-anchor="middle">rows 0..7: one MVMUL (8 x 16 @ 16 x 16)</text>
  <text class="formula" x="405" y="943" text-anchor="middle">rows 8..15: one MVMUL (8 x 16 @ 16 x 16)</text>
  <text class="small" x="405" y="990" text-anchor="middle">One 16 x 16 face product requires 2 MVMULs.</text>

  <!-- Count for one spatial pass -->
  <rect class="panel" x="80" y="1040" width="1280" height="105" rx="14" />
  <text class="count" x="720" y="1083" text-anchor="middle">4 C faces x 2 face products x 2 row halves = 16 MVMULs per fidelity phase</text>
  <text class="small" x="720" y="1122" text-anchor="middle">The same 16-instruction spatial walk is replayed for each fidelity phase.</text>
</svg>
