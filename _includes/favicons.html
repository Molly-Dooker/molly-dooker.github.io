{% capture favicon_path %}{{ '/assets/img/favicons' | relative_url }}{% endcapture %}

<!-- Keep the browser tab's favicon slot visually empty. -->
<link rel="icon" type="image/svg+xml" href="{{ favicon_path }}/transparent.svg">
{% if site.pwa.enabled %}
  <link rel="manifest" href="{{ favicon_path }}/site.webmanifest">
{% endif %}
